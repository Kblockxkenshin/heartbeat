const JC={};
function baseJourney(t,sc){
  const k=t.id+'|'+sc;if(JC[k])return JC[k];
  const tl=timeline(t,sc),n=tl.length,r=rng(hash(k));
  let off=0;const m=sc.match(/^s(\d+)/);if(m&&t.seasons)off=(shapeAt(t.shape,(+m[1]-1)/Math.max(1,t.seasons.length-1))-.6)*.35;
  const pts=tl.map((lab,i)=>{
    const x=n>1?i/(n-1):0;let I=clamp(shapeAt(t.shape,x)+off+(r()-.5)*.25,0,1);
    const tw=(t.twists||[]).some(f=>Math.abs(f-x)<.5/n);
    const v=18+Math.round(r()*40),f=t.flavor;
    const w={'Boring':Math.pow(1-I,2)*1.3,'Amazing':I*I*1.3,'Funny':f.funny*(.3+r()*.5),'Scary':f.scary*(.3+r()*.5)*(.5+I),'Sad':f.sad*(.2+r()*.5)*(.4+x),'Plot twist':tw?1.4:(I>.7?.15*r():.02)};
    const sum=Object.values(w).reduce((a,b)=>a+b,0),tags={};
    TAGS.forEach(g=>tags[g]=Math.round(w[g]/sum*v));
    return{...lab,I,tags};
  });
  let g=pts.findIndex(p=>p.I>=.62);if(g<0)g=pts.reduce((b,p,i)=>p.I>pts[b].I?i:b,0);
  const gotGood=pts.map((_,i)=>Math.round(120*Math.exp(-Math.pow(i-g,2)/(2*(n>6?1.3:.7)))*(0.85+r()*.3)));
  const quits=pts.map((p,i)=>i===n-1?0:Math.round((1-p.I)*34*(1-i/n*.65)*(0.7+r()*.6)));
  JC[k]={pts,gotGood,quits};return JC[k];
}
function journey(t,sc){
  const b=baseJourney(t,sc),k=t.id+'|'+sc;
  const pts=b.pts.map(p=>({...p,tags:{...p.tags}}));
  U.tags.filter(x=>x.k===k).forEach(x=>{if(pts[x.i])pts[x.i].tags[x.tag]++});
  const gotGood=b.gotGood.slice(),quits=b.quits.slice();
  if(U.gotGood[k]!=null&&gotGood[U.gotGood[k]]!=null)gotGood[U.gotGood[k]]++;
  if(U.quit[k]!=null&&quits[U.quit[k]]!=null)quits[U.quit[k]]++;
  return{pts,gotGood,quits};
}
function beat(tags){const tot=Object.values(tags).reduce((a,b)=>a+b,0)||1;return(tags['Amazing']*1+tags['Plot twist']*1.25+tags['Funny']*.7+tags['Scary']*.85+tags['Sad']*.65-tags['Boring']*1.1)/tot}
const dom=tags=>TAGS.reduce((b,g)=>tags[g]>tags[b]?g:b,TAGS[0]);
const argmax=a=>a.reduce((b,v,i)=>v>a[b]?i:b,0);

/* =============== taste =============== */
function sim(a,b){const ks=Object.keys(a).filter(k=>b[k]!=null);if(ks.length<2)return null;const d=ks.reduce((s,k)=>s+Math.abs(a[k]-b[k]),0)/ks.length;return{pct:clamp(Math.round(100-d*15+Math.min(ks.length,6)),0,99),shared:ks}}
function yourScore(t){
  let w=0,s=0,n=0;PEOPLE.forEach(p=>{if(p.r[t.id]==null)return;const m=sim(U.ratings,p.r);if(!m)return;const wt=Math.pow(m.pct/100,3);w+=wt;s+=wt*p.r[t.id];n++});
  if(!w||Object.keys(U.ratings).length<2)return null;
  return{score:Math.round((s/w*.75+t.hype[1]*.25)*10)/10,n};
}

/* =============== link checking for video reviews =============== */
function parseVideo(url){
  url=(url||'').trim();let m;
  if(m=url.match(/^(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/(?:shorts\/|watch\?v=)|youtu\.be\/)([\w-]{11})(?:[?&#].*)?$/))return{plat:'YouTube Shorts',embed:'https://www.youtube-nocookie.com/embed/'+m[1]};
  if(m=url.match(/^(?:https?:\/\/)?(?:www\.|m\.)?tiktok\.com\/@[\w.-]+\/video\/(\d{8,})(?:[?#].*)?$/))return{plat:'TikTok',embed:'https://www.tiktok.com/embed/v2/'+m[1]};
  if(m=url.match(/^(?:https?:\/\/)?(?:vm|vt)\.tiktok\.com\/[\w]+\/?$/))return{plat:'TikTok',embed:null};
  if(m=url.match(/^(?:https?:\/\/)?(?:www\.)?instagram\.com\/(?:reel|reels|p)\/([\w-]+)\/?(?:[?#].*)?$/))return{plat:'Instagram Reel',embed:'https://www.instagram.com/reel/'+m[1]+'/embed'};
  return null;
}

/* =============== search (with spelling mistakes) =============== */
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
function localSearch(q){
  q=norm(q);if(!q)return[];
  return TITLES.map(t=>{const n=norm(t.name);let sc=n.startsWith(q)?0:n.includes(q)?1:99;
    if(sc===99){const words=n.split(' ').concat([n]);const best=Math.min(...words.map(w=>lev(q,w.slice(0,Math.max(q.length,Math.min(w.length,q.length+1))))));if(best<=Math.max(1,Math.floor(q.length/3)))sc=2+best}
    return{t,sc}}).filter(x=>x.sc<99).sort((a,b)=>a.sc-b.sc).map(x=>x.t);
}
async function tmdbSearch(q){
  if(!LIVE)return[];
  try{const r=await fetch('/api/tmdb?q='+encodeURIComponent(q));if(!r.ok)return[];const j=await r.json();return j.results||[]}catch(e){return[]}
}
async function tmdbLoad(type,id){
  const key='tmdb-'+type+'-'+id;if(BYID[key])return BYID[key];
  const r=await fetch(`/api/tmdb?type=${type}&id=${id}`);if(!r.ok)throw new Error('load failed');const d=await r.json();
  const rr=rng(hash(key));const sh=Array.from({length:5},()=>.35+rr()*.6);
  const t={id:key,name:d.name,type,year:d.year,genres:d.genres||[],cast:d.cast||[],plot:d.plot||'',poster:d.poster,runtime:d.runtime||110,seasons:d.seasons&&d.seasons.length?d.seasons:[8],shape:sh,flavor:{funny:rr()*.6,scary:rr()*.5,sad:rr()*.5},twists:[.5+rr()*.45],hype:[Math.round((6.5+rr()*2.5)*10)/10,Math.round((6.5+rr()*2.5)*10)/10],vibes:{'Funny':rr()*.6,'Scary':rr()*.5,'Sad':rr()*.5,'Mind-blowing':rr()*.6,'Boring':rr()*.25,'Comfort watch':rr()*.4},worth:[.5,.35,.15],best:{'With friends':.4,'Date night':.25,'Alone at 2am':.25,'Family':.1},colors:['#2a2a40','#ff3d7f'],live:true};
  BYID[key]=t;return t;
}

function heartbeatSVG(t,tl,J,sel,vids,prog,forExport){
  const W=360,H=190,P=20,top=forExport?60:30,bot=H-34+(forExport?40:0),HH=forExport?H+70:H;
  const n=tl.length,raw=J.pts.map(p=>beat(p.tags));
  const vals=raw.map((v,i)=>(raw[i-1]??v)*.25+v*.5+(raw[i+1]??v)*.25);
  const mn=Math.min(...vals)-.1,mx=Math.max(...vals)+.1;
  const xs=vals.map((_,i)=>n>1?P+i*(W-2*P)/(n-1):W/2),ys=vals.map(v=>bot-(v-mn)/(mx-mn)*(bot-top));
  let d=`M${xs[0]},${ys[0]}`;
  for(let i=0;i<n-1;i++){const x0=xs[i-1]??xs[i],y0=ys[i-1]??ys[i],x3=xs[i+2]??xs[i+1],y3=ys[i+2]??ys[i+1];
    d+=` C${xs[i]+(xs[i+1]-x0)/6},${ys[i]+(ys[i+1]-y0)/6} ${xs[i+1]-(x3-xs[i])/6},${ys[i+1]-(y3-ys[i])/6} ${xs[i+1]},${ys[i+1]}`}
  const area=d+` L${xs[n-1]},${bot} L${xs[0]},${bot} Z`;
  const step=n>1?(W-2*P)/(n-1):W;const every=n>14?3:n>9?2:1;
  const pk=argmax(vals);
  const vm={};vids.forEach(v=>{if(v.moment!=null)vm[v.moment]=(vm[v.moment]||0)+1});
  return`<svg viewBox="0 0 ${W} ${HH}" width="100%" role="img" aria-label="Heartbeat graph for ${esc(t.name)}" xmlns="http://www.w3.org/2000/svg" style="display:block;font-family:system-ui,Segoe UI,sans-serif">
  <defs><linearGradient id="hbf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3d7f" stop-opacity=".45"/><stop offset="1" stop-color="#ff3d7f" stop-opacity="0"/></linearGradient>
  <linearGradient id="hbl" x1="0" x2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff3d7f"/></linearGradient></defs>
  ${forExport?`<rect width="${W}" height="${HH}" fill="#0b0b12"/><text x="${P}" y="26" fill="#fff" font-size="17" font-weight="900">${esc(t.name)} · Heartbeat</text><text x="${P}" y="44" fill="#9a9ab0" font-size="11">Where it gets good: ${esc(tl[argmax(J.gotGood)].l)}</text>`:''}
  <line x1="${P}" x2="${W-P}" y1="${bot}" y2="${bot}" stroke="#2a2a3d"/>
  <path d="${area}" fill="url(#hbf)"/>
  <path d="${d}" fill="none" stroke="url(#hbl)" stroke-width="3.2" stroke-linecap="round"/>
  ${forExport?'':`<circle cx="${xs[pk]}" cy="${ys[pk]}" r="5" fill="none" stroke="#ff3d7f" stroke-width="2" class="pulse"/>`}
  ${xs.map((x,i)=>{const g=dom(J.pts[i].tags);return`<circle cx="${x}" cy="${ys[i]}" r="${i===sel&&!forExport?7:4}" fill="${TAGC[g]}" stroke="${i===sel&&!forExport?'#fff':'#0b0b12'}" stroke-width="2"/>`}).join('')}
  ${Object.keys(vm).map(i=>`<text x="${xs[i]}" y="${ys[i]-12}" font-size="12" text-anchor="middle">${+i>prog&&!forExport?'🔒':'🎬'}</text>`).join('')}
  ${tl.map((x,i)=>i%every===0||i===n-1?`<text x="${xs[i]}" y="${bot+16}" fill="#9a9ab0" font-size="10" text-anchor="middle">${esc(x.s)}</text>`:'').join('')}
  ${forExport?`<text x="${W-P}" y="${HH-8}" fill="#ff3d7f" font-size="11" font-weight="800" text-anchor="end">heartbeat · rate the journey</text>`:xs.map((x,i)=>`<rect data-pt="${i}" x="${x-step/2}" y="0" width="${step}" height="${H}" fill="transparent" style="cursor:pointer"><title>${esc(tl[i].l)}</title></rect>`).join('')}
  </svg>`;
}

function wireTitle(t,sc,k,tl){
  const app=$('#app');
  app.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.scope[t.id]=b.dataset.scope;rerenderTitle(t)});
  const hb=$('#hb');hb.onclick=e=>{const r=e.target.closest('[data-pt]');if(!r)return;S.sel[k]=+r.dataset.pt;rerenderTitle(t)};
  $('#pp').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;const i=S.sel[k]??argmax(journey(t,sc).pts.map(p=>beat(p.tags)));const tag=b.dataset.tag;const ix=U.tags.findIndex(x=>x.k===k&&x.i===i&&x.tag===tag);if(ix>=0)U.tags.splice(ix,1);else U.tags.push({k,i,tag});save();rerenderTitle(t)};
  $('#prog').onchange=e=>{U.progress[k]=+e.target.value;save();rerenderTitle(t)};
  app.querySelectorAll('[data-gg]').forEach(b=>b.onclick=()=>{const i=+b.dataset.gg;U.gotGood[k]=U.gotGood[k]===i?null:i;if(U.gotGood[k]==null)delete U.gotGood[k];save();rerenderTitle(t)});
  app.querySelectorAll('[data-quit]').forEach(b=>b.onclick=()=>{const i=+b.dataset.quit;if(U.quit[k]===i)delete U.quit[k];else U.quit[k]=i;save();rerenderTitle(t)});
  const sl=(id,f)=>{const el=$('#'+id);el.oninput=()=>{$('#'+id+'v').textContent=el.value};el.onchange=()=>{f(+el.value);save();rerenderTitle(t)}};
  sl('pred',v=>{U.hype[t.id]={...(U.hype[t.id]||{}),pred:v}});
  sl('real',v=>{U.hype[t.id]={...(U.hype[t.id]||{}),real:v}});
  sl('rate',v=>{U.ratings[t.id]=v});
  const tog=(obj,v)=>{const a=U[obj][t.id]||[];U[obj][t.id]=a.includes(v)?a.filter(x=>x!==v):a.concat(v);save();rerenderTitle(t)};
  app.querySelectorAll('[data-vibe]').forEach(b=>b.onclick=()=>tog('vibes',b.dataset.vibe));
  app.querySelectorAll('[data-best]').forEach(b=>b.onclick=()=>tog('best',b.dataset.best));
  app.querySelectorAll('[data-worth]').forEach(b=>b.onclick=()=>{U.worth[t.id]=U.worth[t.id]===b.dataset.worth?null:b.dataset.worth;save();rerenderTitle(t)});
  app.querySelectorAll('[data-reveal]').forEach(p=>{const f=()=>p.classList.remove('spoiler');p.onclick=f;p.onkeydown=e=>{if(e.key==='Enter')f()}});
  $('#rvp').onclick=()=>{const tx=$('#rvt').value.trim();if(!tx)return toast('Write something first');(U.reviews[t.id]=U.reviews[t.id]||[]).unshift({h:U.name.toLowerCase().replace(/\s+/g,''),s:$('#rvs').checked,t:tx});save();toast('Review posted');rerenderTitle(t)};
  $('#addVid').onclick=()=>addVideoSheet(t);
  $('#saveVc').onclick=()=>saveVibeImage(t);
  $('#saveHb').onclick=()=>{const J=journey(t,sc);saveSvgImage(heartbeatSVG(t,tl,J,-1,sc==='all'?videosFor(t):[],99,true),t.id+'-heartbeat.png')};
  app.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{const w=b.dataset.share;const url=location.href.split('#')[0]+'#/t/'+t.id;
    const txt=w==='vibe'?`${t.name}'s vibe: ${Object.entries(t.vibes).sort((a,b)=>b[1]-a[1])[0][0]}. Worth it? ${WORTH[argmax(t.worth)]}.`:w==='heartbeat'?`${t.name} gets good at ${tl[argmax(journey(t,sc).gotGood)].l}. See the Heartbeat 💓`:`Is ${t.name} worth watching? See where it gets good 💓`;
    shareSheet(url,txt,w==='vibe'?()=>saveVibeImage(t):w==='heartbeat'?()=>$('#saveHb').click():null)});
}

    <div class="over"><div style="font-weight:800">@${esc(v.h)} <span class="meta">· ${esc(v.plat)}</span></div><div style="margin:4px 0">${esc(v.cap)}</div>${v.moment!=null?`<span class="pill">📍 ${esc(tl[v.moment].l)}</span>`:''}</div>
    <div class="acts">

      <button data-cm aria-label="Comments"><span>💬</span>${v.comments.length+(U.comments[v.id]||[]).length}</button>
      <button data-help class="${U.helped[v.id]?'on':''}" aria-label="This helped me decide"><span>✅</span>Helped<br>${v.helped+(U.helped[v.id]?1:0)}</button>
      <button data-rep aria-label="Report"><span>🚩</span>Report</button>
    </div></section>`}).join('')}
    ${!vids.length?'<div class="slide"><div class="empty">No videos yet</div></div>':''}

    const keep=()=>{const y=feed.scrollTop;renderFeed(t);$('#feed').scrollTop=y};

    if(e.target.closest('[data-like]')){U.likes[id]=!U.likes[id];save();keep()}

  <div class="card"><h3>🔗 Invite a friend</h3><div class="sub">Send a link. They join, rate a few titles, and you both see your match score.</div><button class="btn full" id="inv">Send Taste Match invite</button></div>
  <div class="card"><h3>👥 People like you</h3>${ms.map(({p,m})=>`<div class="person"><div class="av" style="background:${p.c}22;color:${p.c}">${esc(p.h[0].toUpperCase())}</div><div style="flex:1"><b>@${esc(p.h)}</b><div class="meta">${m.shared.length} titles in common</div></div><b style="font-size:20px;color:${m.pct>=80?'var(--pink)':'var(--text)'}">${m.pct}%</b></div>`).join('')}</div>
  <div class="card"><h3>⭐ Your ratings (${rated})</h3><div class="sub">More ratings = better matches.</div>${TITLES.map(t=>`<div class="slider" style="margin:6px 0"><span style="width:130px;font-size:14px">${esc(t.name)}</span><input type="range" min="0" max="10" value="${U.ratings[t.id]||0}" data-r="${t.id}" aria-label="Rate ${esc(t.name)}"><b>${U.ratings[t.id]||'–'}</b></div>`).join('')}<div class="meta">Slide to 0 to remove a rating.</div></div>
  ${FOOT}${nav('Taste Match')}`;
  $('#inv').onclick=()=>{const code=(hash(U.name+U.joined)%1e8).toString(36);shareSheet(location.href.split('#')[0]+'#/invite/'+code,`Are we movie twins? 💞 Join Heartbeat and see our Taste Match score.`,null)};
  document.querySelectorAll('[data-r]').forEach(el=>{el.oninput=()=>{el.nextElementSibling.textContent=el.value==='0'?'–':el.value};el.onchange=()=>{const v=+el.value;if(v)U.ratings[el.dataset.r]=v;else delete U.ratings[el.dataset.r];save();const y=scrollY;renderMatch();scrollTo(0,y)}});
}
function renderInvite(code){
  setMeta('You got a Taste Match invite · Heartbeat','Join to see how much your movie taste matches your friend.');
  const p=PEOPLE[hash(code)%PEOPLE.length];
  $('#app').innerHTML=DEMO+`<header class="top"><div class="logo">${LOGO}heartbeat</div></header>
  <div class="card" style="text-align:center;margin-top:20px"><div style="font-size:48px">💞</div><h3 style="justify-content:center;font-size:22px">Are you movie twins?</h3>
  <div class="sub">A friend wants to compare your taste. Join and rate 3 titles to see your score.</div>
  <div class="match-ring" style="background:var(--card2)"><b style="filter:blur(8px)">87%</b><span class="meta">hidden</span></div>
  <button class="btn full" id="join">Join with Google</button><button class="btn ghost full" style="margin-top:8px" id="join2">Join with email</button>
  <div class="meta" style="margin-top:10px">Demo: login turns on after you set up Supabase.</div></div>${FOOT}`;
  const go=()=>{toast('Demo: pretending you joined');setTimeout(()=>location.hash='#/match',600)};
  $('#join').onclick=go;$('#join2').onclick=go;
}

/* =============== PROFILE =============== */
function renderMe(){
  setMeta('My profile · Heartbeat','Your ratings, video reviews and taste summary.');
  const vibeCount={};Object.values(U.vibes).flat().forEach(v=>vibeCount[v]=(vibeCount[v]||0)+1);
  TITLES.forEach(t=>{if((U.ratings[t.id]||0)>=8)Object.entries(t.vibes).forEach(([v,x])=>vibeCount[v]=(vibeCount[v]||0)+x)});
  const top=Object.entries(vibeCount).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).filter(x=>x!=='Boring');
  const myVids=Object.entries(U.videos).flatMap(([id,a])=>a.map(v=>({...v,tid:id})));
  const ms=PEOPLE.map(p=>({p,m:sim(U.ratings,p.r)})).filter(x=>x.m).sort((a,b)=>b.m.pct-a.m.pct).slice(0,3);
  $('#app').innerHTML=DEMO+`<header class="top"><div class="logo">${LOGO}Me</div></header>
  <div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:60px;height:60px;font-size:24px;background:linear-gradient(135deg,var(--yellow),var(--pink));color:#0b0b12">${esc((U.name[0]||'Y').toUpperCase())}</div>
  <div style="flex:1"><input id="nm" value="${esc(U.name)}" aria-label="Your name" style="padding:8px 10px;font-weight:800"></div></div>
  <div style="margin-top:12px"><span class="badge">🏅 Founding Reviewer</span></div>
  <div class="lbl">Your taste</div><div style="font-size:18px;font-weight:800">${top.length?'You love '+top.map(v=>VIBEE[v]+' '+v.toLowerCase()).join(' and ')+' stories.':'Rate a few titles to see your taste.'}</div></div>
  <div class="card"><h3>⭐ Ratings</h3>${Object.entries(U.ratings).map(([id,v])=>BYID[id]?`<a class="person" href="#/t/${id}" style="color:inherit;text-decoration:none">${poster(BYID[id],'sm')}<div style="flex:1"><b>${esc(BYID[id].name)}</b></div><b>${v}/10</b></a>`:'').join('')||'<div class="empty">No ratings yet.</div>'}</div>
  <div class="card"><h3>🎬 My video reviews</h3>${myVids.map(v=>`<a class="person" href="#/feed/${v.tid}/${v.id}" style="color:inherit;text-decoration:none"><div class="av" style="background:var(--card2)">▶</div><div><b>${esc(BYID[v.tid]?.name||'')}</b><div class="meta">${esc(v.plat)} · ${esc(v.cap)}</div></div></a>`).join('')||'<div class="empty">No video reviews yet. Add one from any title page.</div>'}</div>
  <div class="card"><h3>💞 Taste Match</h3>${ms.map(({p,m})=>`<div class="person"><div class="av" style="background:${p.c}22;color:${p.c}">${esc(p.h[0].toUpperCase())}</div><div style="flex:1">@${esc(p.h)}</div><b>${m.pct}%</b></div>`).join('')}</div>
  <div class="card"><h3>🔐 Account</h3><div class="sub">Sign in to save your ratings everywhere. (Turns on after you connect Supabase.)</div><div class="btns"><button class="btn ghost" data-demo>Continue with Google</button><button class="btn ghost" data-demo>Sign up with email</button></div>
  <button class="btn ghost small" id="reset" style="margin-top:14px">Clear my demo data</button></div>
  ${FOOT}${nav('Me')}`;
  $('#nm').onchange=e=>{U.name=e.target.value.trim()||'You';save();renderMe()};
  document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>toast('Login turns on after Supabase setup'));
  $('#reset').onclick=()=>{if(confirm('Clear everything you rated in this demo?')){try{localStorage.removeItem(LS)}catch(e){}location.hash='#/';location.reload()}};
}

/* =============== save as image =============== */
function download(canvas,name){canvas.toBlob(b=>{if(!b)return toast('Could not save image');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Image saved')},'image/png')}
function saveSvgImage(svg,name){
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=3;c.width=360*s;c.height=260*s;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);download(c,name)};
  img.onerror=()=>toast('Could not make image');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function saveVibeImage(t){
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,t.colors[0]);g.addColorStop(.6,t.colors[1]);g.addColorStop(1,'#ff3d7f');x.fillStyle=g;x.fillRect(0,0,1080,1350);
  x.fillStyle='#fff';x.font='800 40px system-ui,Segoe UI,sans-serif';x.fillText('VIBE CARD',80,140);
  x.font='900 92px system-ui,Segoe UI,sans-serif';wrapText(x,t.name,80,250,920,100);
  const v=Object.entries(t.vibes).sort((a,b)=>b[1]-a[1]).slice(0,3);
  v.forEach(([k,val],i)=>{const y=520+i*130;x.font='800 48px system-ui,Segoe UI Emoji,sans-serif';x.fillText(VIBEE[k]+' '+k,80,y);x.fillStyle='#ffffff40';rr(x,80,y+24,920,26,13);x.fillStyle='#fff';rr(x,80,y+24,920*val,26,13);x.font='800 40px system-ui';x.textAlign='right';x.fillText(Math.round(val*100)+'%',1000,y);x.textAlign='left'});
  const wi=argmax(t.worth),be=Object.entries(t.best).sort((a,b)=>b[1]-a[1])[0];
  [['WORTH IT?',WORTH[wi]],['BEST FOR',BESTE[be[0]]+' '+be[0]]].forEach(([l,val],i)=>{const bx=80+i*470;x.fillStyle='#00000040';rr(x,bx,960,450,200,30);x.fillStyle='#fff';x.font='700 32px system-ui';x.fillText(l,bx+36,1030);x.font='900 50px system-ui,Segoe UI Emoji,sans-serif';x.fillText(val,bx+36,1110)});
  x.font='900 44px system-ui';x.fillText('💓 heartbeat',80,1270);x.font='600 30px system-ui';x.textAlign='right';x.fillText('rate the journey',1000,1270);
  download(c,t.id+'-vibe-card.png');
}
function rr(x,a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,Math.max(w,h),h,r):x.rect(a,b,w,h);x.fill()}
function wrapText(x,s,a,b,w,lh){const ws=s.split(' ');let line='';ws.forEach(word=>{const t=line?line+' '+word:word;if(x.measureText(t).width>w&&line){x.fillText(line,a,b);b+=lh;line=word}else line=t});x.fillText(line,a,b)}

/* =============== start =============== */
if('serviceWorker' in navigator&&LIVE&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
render();
</script>
